<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Successful | DJ Garvin</title><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0b0b0b;--card:#151514;--fg:#f3efe8;--mut:#9d988d;--acc:#f0c48a;--line:#262522}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "DM Sans",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:70px 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}.ok{color:var(--acc);font:800 2rem Syne;margin-bottom:8px}.ticket{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px}.qr{width:180px;height:180px;background:#fff;border-radius:12px;padding:8px;display:block;margin:16px auto}.mut{color:var(--mut)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;background:var(--acc);color:#111;text-decoration:none;font-weight:700;margin-top:18px}</style></head><body><main class="wrap"><div class="card"><div class="ok">Payment successful</div><p class="mut" id="status">Confirming your ticket…</p><div id="content"></div><a class="btn" href="index.html">Back to DJ Garvin</a></div></main><script>const statusEl=document.getElementById('status'),content=document.getElementById('content');const paypalId=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('djgarvin_paypal_order');async function run(){if(!paypalId){statusEl.textContent='Payment was completed, but the PayPal order reference is missing.';return}try{const r=await fetch('/api/paypal/capture-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:paypalId})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not confirm payment.');statusEl.textContent=`Order ${j.order?.order_number||''} is confirmed.`;content.innerHTML=(j.tickets||[]).map(t=>`<div class="ticket"><strong>${t.ticket_types?.name||'Ticket'}</strong><div>${t.customer_name}</div><div class="mut">Ticket: ${t.ticket_code}</div><img class="qr" alt="Ticket QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(location.origin+'/ticket/verify/'+t.qr_token)}"><div class="mut">Show this QR code at check-in.</div></div>`).join('');sessionStorage.removeItem('djgarvin_paypal_order')}catch(e){statusEl.textContent=e.message||'Could not confirm payment.'}}run();</script></body></html>
