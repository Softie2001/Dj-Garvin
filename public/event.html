<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event — DJ Garvin</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">DJ GARVIN</a><nav><a href="/">Home</a><a href="/about.html">About</a><a href="/events.html">Events & Tickets</a><a href="/#book">Book DJ</a></nav></header><main><section id="event">Loading…</section></main><script>
const slug=new URLSearchParams(location.search).get('slug'); fetch('/api/events/'+encodeURIComponent(slug)).then(r=>r.json()).then(e=>{document.title=e.name+' — DJ Garvin';document.querySelector('#event').innerHTML=`<p class="eyebrow">EVENT</p><h1>${e.name}</h1><p>${e.description||''}</p><p>${new Date(e.event_date).toLocaleString()} · ${e.venue||''} ${e.location||''}</p><div class="cards">${(e.ticket_types||[]).filter(t=>t.status==='active').map(t=>`<article class="card"><h2>${t.name}</h2><div class="price">£${Number(t.price_gbp).toFixed(2)}</div><p>${t.description||''}</p><p>${t.includes||''}</p><a class="btn" href="/ticket/select.html?event=${e.id}&ticket=${t.id}">Explore ticket +</a></article>`).join('')}</div>`});
</script></body></html>
