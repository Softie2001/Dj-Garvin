<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJ Garvin | Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#151514;--fg:#f3efe8;--mut:#9d988d;--acc:#f0c48a;--line:#262522}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Syne,Impact,sans-serif;font-weight:800;line-height:1.08;margin:0}
a{color:inherit}.w{max-width:980px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font:800 1.15rem Syne;letter-spacing:.08em;text-decoration:none}
.links{display:flex;gap:22px;color:var(--mut);font-size:.9rem}.links a{text-decoration:none}
.menu{display:none;border:1px solid var(--line);background:none;color:var(--fg);border-radius:50%;width:44px;height:44px}
main{padding:42px 0 90px}.bar{width:44px;height:3px;background:var(--acc);margin-bottom:20px}
.crumb{color:var(--mut);font-size:.88rem;margin-bottom:12px}
.hero h1{font-size:clamp(2.1rem,8vw,4.2rem);text-transform:uppercase}
.hero .mut{color:var(--mut);margin:14px 0 26px}
.steps{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:28px 0}
.step{padding:11px 12px;text-align:center;color:var(--mut);font-size:.84rem}.step.active{background:#191815;color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
.panel{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px;margin-top:18px}
.ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ticket{border:1px solid var(--line);border-radius:16px;padding:17px;background:#101010}
.ticket.selected{border-color:var(--acc);box-shadow:0 0 0 1px rgba(240,196,138,.15)}
.ticket-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ticket h3{font-size:1.2rem}.price{font-weight:800;color:var(--acc);white-space:nowrap}
.ticket p{color:var(--mut);font-size:.88rem;margin:8px 0}
.include{font-size:.8rem;color:#c5c0b7;margin-top:8px}
.qty{display:flex;align-items:center;gap:12px;margin-top:14px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#171715;color:var(--fg);font-size:1.2rem;cursor:pointer}
.qty span{min-width:24px;text-align:center;font-weight:800}
.form{display:grid;gap:14px}
label{display:block;font-size:.86rem;margin-bottom:6px}
input{width:100%;min-height:50px;padding:12px 14px;border:1px solid #33312d;border-radius:12px;background:#101010;color:var(--fg);font:inherit}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn{min-height:50px;padding:0 24px;border-radius:999px;border:1px solid var(--fg);background:none;color:var(--fg);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#111}
.btn:disabled{opacity:.45;cursor:not-allowed}
.summary{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border:0}.total{font:800 1.45rem Syne;margin-top:10px}
.notice{padding:13px 14px;border-left:3px solid var(--acc);background:#101010;border-radius:6px;color:var(--mut);margin-top:15px}
.hidden{display:none!important}
@media(max-width:700px){
 .links{display:none}.menu{display:block}
 .ticket-grid{grid-template-columns:1fr}
 .panel{padding:16px;border-radius:17px}
 .actions .btn{width:100%}
 .steps{margin-top:22px}
}
</style>
</head>
<body>
<header>
  <div class="w nav">
    <a class="logo" href="/">DJ GARVIN</a>
    <nav class="links"><a href="/">Home</a><a href="/about">About</a><a href="/events">Events</a><a href="/gallery">Gallery</a><a href="/contact">Contact</a></nav>
    <button class="menu" onclick="location.href='/'" aria-label="Back to home">⌂</button>
  </div>
</header>

<main>
<div class="w">
  <div class="bar"></div>
  <div class="crumb"><a href="/events">Events</a> / Buy Ticket</div>
  <div class="hero">
    <h1 id="eventName">Loading event…</h1>
    <div class="mut" id="eventMeta"></div>
  </div>

  <div class="steps">
    <div id="step1Label" class="step active">1. Your details</div>
    <div id="step2Label" class="step">2. Review</div>
  </div>

  <section id="step1" class="panel">
    <h2>Select tickets</h2>
    <div id="tickets" class="ticket-grid" style="margin-top:16px"></div>

    <div class="summary">
      <div class="row"><span>Selected tickets</span><strong id="selectedCount">0</strong></div>
      <div class="row"><span>Total</span><strong id="step1Total">£0.00</strong></div>
    </div>

    <h2 style="margin-top:28px">Your details</h2>
    <form id="detailsForm" class="form" autocomplete="on" style="margin-top:16px">
      <div>
        <label for="firstName">First name</label>
        <input id="firstName" name="first_name" autocomplete="given-name" required>
      </div>
      <div>
        <label for="lastName">Last name</label>
        <input id="lastName" name="last_name" autocomplete="family-name" required>
      </div>
      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="phone">Phone number <span class="mut">(optional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
      </div>
      <div id="formNotice" class="notice hidden"></div>
      <div class="actions">
        <button class="btn primary" type="submit">Review Booking</button>
      </div>
    </form>
  </section>

  <section id="step2" class="panel hidden">
    <h2>Review booking</h2>
    <div id="reviewItems" style="margin-top:14px"></div>
    <div class="summary">
      <div class="row"><span>Total</span><strong id="reviewTotal">£0.00</strong></div>
    </div>
    <div class="notice">Your details are already saved from the previous step. You do not need to enter them again.</div>
    <div class="actions">
      <button id="backBtn" class="btn" type="button">Back</button>
      <button id="paymentBtn" class="btn primary" type="button">Continue to Payment</button>
    </div>
    <div id="paymentNotice" class="notice hidden"></div>
  </section>
</div>
</main>

<script>
const params=new URLSearchParams(location.search);
const eventKey=params.get("id")||params.get("slug");
const state={event:null,tickets:[],qty:{},details:{},total:0};

const $=id=>document.getElementById(id);
const money=n=>"£"+Number(n||0).toFixed(2);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function showNotice(id,msg){const el=$(id);el.textContent=msg;el.classList.remove("hidden")}
function hideNotice(id){$(id).classList.add("hidden")}

function formatDate(v){
 const d=new Date(v); if(Number.isNaN(d.getTime()))return "";
 return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
}
function formatTime(v){
 if(!v)return "";
 const m=String(v).match(/^(\\d{1,2}):(\\d{2})/); if(!m)return "";
 let h=Number(m[1]); const ap=h>=12?"PM":"AM"; h=h%12||12;
 return `${h}:${m[2]} ${ap}`;
}

function renderTickets(){
 const box=$("tickets");
 const list=(state.event.ticket_types||[]).filter(t=>t.status==="on_sale"||t.status==="active");
 if(!list.length){box.innerHTML='<div class="notice" style="grid-column:1/-1">Tickets are currently unavailable.</div>';return}
 box.innerHTML=list.map(t=>{
   const q=state.qty[t.id]||0;
   const desc=t.description||"";
   const included=t.whats_included||t.includes||"";
   return `<article class="ticket ${q>0?"selected":""}">
     <div class="ticket-top"><h3>${esc(t.name)}</h3><div class="price">${money(t.price_gbp)}</div></div>
     ${desc?`<p>${esc(desc)}</p>`:""}
     ${included?`<div class="include">✓ ${esc(included)}</div>`:""}
     <div class="qty">
       <button type="button" onclick="changeQty('${t.id}',-1)" aria-label="Decrease ${esc(t.name)}">−</button>
       <span>${q}</span>
       <button type="button" onclick="changeQty('${t.id}',1)" aria-label="Increase ${esc(t.name)}">+</button>
     </div>
   </article>`;
 }).join("");
 updateTotal();
}

function changeQty(id,delta){
 const t=state.event.ticket_types.find(x=>String(x.id)===String(id));
 if(!t)return;
 const max=Math.max(0,Number(t.capacity||0)-Number(t.quantity_sold||0));
 const next=Math.max(0,(state.qty[id]||0)+delta);
 state.qty[id]=max>0?Math.min(next,max):next;
 renderTickets();
}

function selectedItems(){
 return Object.entries(state.qty).filter(([,q])=>q>0).map(([id,quantity])=>{
   const t=state.event.ticket_types.find(x=>String(x.id)===String(id));
   return {ticket_type_id:id,name:t.name,quantity,unit_price:Number(t.price_gbp||0),total:Number(t.price_gbp||0)*quantity};
 });
}
function updateTotal(){
 const items=selectedItems();
 state.total=items.reduce((s,x)=>s+x.total,0);
 $("selectedCount").textContent=items.reduce((s,x)=>s+x.quantity,0);
 $("step1Total").textContent=money(state.total);
}

function showStep2(){
 const items=selectedItems();
 if(!items.length){showNotice("formNotice","Please choose at least one ticket.");return}
 const f=$("detailsForm");
 if(!f.reportValidity())return;
 state.details={
   first_name:$("firstName").value.trim(),
   last_name:$("lastName").value.trim(),
   email:$("email").value.trim(),
   phone:$("phone").value.trim()
 };
 if(!state.details.first_name||!state.details.last_name||!state.details.email){
   showNotice("formNotice","Please complete your first name, last name and email.");return;
 }
 hideNotice("formNotice");
 $("reviewItems").innerHTML=items.map(x=>`<div class="row"><span>${esc(x.name)} × ${x.quantity}</span><strong>${money(x.total)}</strong></div>`).join("");
 $("reviewTotal").textContent=money(state.total);
 $("step1").classList.add("hidden");
 $("step2").classList.remove("hidden");
 $("step1Label").classList.remove("active");
 $("step2Label").classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}

$("detailsForm").addEventListener("submit",e=>{e.preventDefault();showStep2()});
$("backBtn").addEventListener("click",()=>{
 $("step2").classList.add("hidden");$("step1").classList.remove("hidden");
 $("step2Label").classList.remove("active");$("step1Label").classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
});

$("paymentBtn").addEventListener("click",async()=>{
 const btn=$("paymentBtn");
 if(!state.event||!state.details)return;
 const items=selectedItems();
 if(!items.length){showNotice("paymentNotice","Please select a ticket.");return}
 btn.disabled=true;btn.textContent="Connecting to PayPal…";hideNotice("paymentNotice");
 try{
   const res=await fetch("/api/paypal/create-order",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       event_id:state.event.id,
       first_name:state.details.first_name,
       last_name:state.details.last_name,
       email:state.details.email,
       phone:state.details.phone,
       items:items.map(x=>({ticket_type_id:x.ticket_type_id,quantity:x.quantity}))
     })
   });
   const data=await res.json();
   if(!res.ok||!data.ok)throw new Error(data.error||"Could not start PayPal payment.");
   if(!data.approval_url)throw new Error("PayPal did not return a payment link.");
   location.href=data.approval_url;
 }catch(err){
   showNotice("paymentNotice",err.message||"Could not start payment. Please try again.");
   btn.disabled=false;btn.textContent="Continue to Payment";
 }
});

async function load(){
 try{
   if(!eventKey)throw new Error("No event was selected.");
   const res=await fetch("/api/events/"+encodeURIComponent(eventKey));
   const data=await res.json();
   if(!res.ok)throw new Error(data.error||"Event not found.");
   state.event=data;
   $("eventName").textContent=data.name||"Event";
   $("eventMeta").textContent=[formatDate(data.event_date),formatTime(data.start_time),data.venue||data.location].filter(Boolean).join(" • ");
   renderTickets();
 }catch(err){
   $("eventName").textContent="Event unavailable";
   $("eventMeta").textContent=err.message||"This event could not be loaded.";
   $("step1").innerHTML='<div class="notice">Please return to the Events page and choose an available event.</div>';
 }
}
load();
</script>
</body>
</html>
