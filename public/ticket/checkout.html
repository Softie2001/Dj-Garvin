<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">DJ GARVIN</a></header><main><section><p class="eyebrow">CHECKOUT</p><h1>Your details</h1><form id="checkout"><input name="first_name" placeholder="First name" required><input name="last_name" placeholder="Last name" required><input name="email" type="email" placeholder="Email address" required><input name="phone" placeholder="Phone / WhatsApp"><button class="btn">Proceed to PayPal</button></form><p id="notice"></p></section></main><script>
