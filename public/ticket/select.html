<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Ticket</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">DJ GARVIN</a></header><main><section id="ticket">Loading…</section></main><script>
const p=new URLSearchParams(location.search),eventId=p.get('event'),ticketId=p.get('ticket'); fetch('/api/events').then(r=>r.json()).then(events=>{const e=events.find(x=>x.id===eventId);const t=e?.ticket_types?.find(x=>x.id===ticketId);if(!e||!t)throw Error();let qty=1;const render=()=>document.querySelector('#ticket').innerHTML=`<p class="eyebrow">TICKET</p><h1>${t.name}</h1><p>${t.description||''}</p><p>${t.includes||''}</p><div class="price">£${Number(t.price_gbp).toFixed(2)}</div><div class="qty"><button id="minus">−</button><strong>${qty}</strong><button id="plus">+</button></div><p>Total: <strong>£${(qty*Number(t.price_gbp)).toFixed(2)}</strong></p><button class="btn" id="go">Continue to checkout</button>`;render();document.addEventListener('click',x=>{if(x.target.id==='minus')qty=Math.max(1,qty-1),render();if(x.target.id==='plus')qty=Math.min(t.capacity-t.sold_count,qty+1),render();if(x.target.id==='go')location.href='/ticket/checkout.html?event='+eventId+'&ticket='+ticketId+'&qty='+qty;});}).catch(()=>document.querySelector('#ticket').textContent='Ticket not found.');
</script></body></html>
