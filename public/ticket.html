<div id="mbd"></div><main><div class="ticket-wrap"><div class="bar"></div><h1 id="eventName">Tickets</h1><p id="eventMeta" class="mut" style="margin:14px 0 30px"></p><div id="types" class="ticket-grid"></div><div id="checkout" style="display:none;margin-top:40px"><div class="bar"></div><h2>Customer details</h2><p class="mut">No account is required.</p><div class="form-grid" style="margin-top:22px"><div><label>First name</label><input id="first"></div><div><label>Last name</label><input id="last"></div><div><label>Email</label><input id="email" type="email"></div><div><label>Phone</label><input id="phone"></div></div><div id="summary" class="notice" style="margin-top:22px"></div><button id="pay" class="btn f" style="margin-top:18px">Proceed to PayPal</button><p id="status" class="mut" style="margin-top:14px"></p></div></div></main><footer><div class="w"><div><strong style="font-family:Syne;letter-spacing:.08em;color:var(--fg)">DJ GARVIN</strong><br>Afrobeats, Amapiano, Afrofusion, Hip Hop, R&amp;B, Dancehall, Pop, House, EDM</div><div>&copy; 2026 DJ Garvin. All rights reserved.</div></div></footer><script>const $=i=>document.getElementById(i);const state={items:[]};function setMenu(o){$('ln').classList.toggle('o',o);$('mbd').classList.toggle('o',o);$('mb').classList.toggle('x',o)}$('mb').onclick=()=>setMenu(!$('ln').classList.contains('o'));$('ln').onclick=e=>{if(e.target.closest('a'))setMenu(false)};function money(p){return '£'+(p/100).toFixed(2)}async function load(){const id=new URLSearchParams(location.search).get('event');if(!id){$('eventName').textContent='Tickets';$('eventMeta').textContent='Select an event first.';$('types').innerHTML='<div class="notice" style="grid-column:1/-1"><a class="btn f" href="events.html">Choose an event</a></div>';return}let e=null;try{const r=await fetch('/api/events/'+encodeURIComponent(id));if(r.ok)e=await r.json()}catch(x){}if(!e){$('eventName').textContent='Tickets';$('eventMeta').textContent='Event unavailable.';$('types').innerHTML='<div class="notice" style="grid-column:1/-1">This event could not be loaded. <a href="events.html">Back to events</a>.</div>';return}$('eventName').textContent=e.name||'Tickets';$('eventMeta').textContent=[e.event_date?new Date(e.event_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'',e.event_date?new Date(e.event_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'',e.venue||''].filter(Boolean).join(' • ');const types=(Array.isArray(e.ticket_types)?e.ticket_types:[]).filter(t=>t.status==='on_sale');state.items=types.map(t=>({...t,qty:0}));$('types').innerHTML=state.items.length?state.items.map((t,i)=>`<div class="ticket-card"><h2>${t.name}</h2><p class="mut">${t.description||''}</p><div class="ticket-price">${money(t.price_pence)}</div><div class="qty"><button type="button" onclick="change(${i},-1)">−</button><span id="q${i}">0</span><button type="button" onclick="change(${i},1)">+</button></div></div>`).join(''):'<div class="notice" style="grid-column:1/-1">No ticket types are currently available for this event.</div>'}function change(i,d){state.items[i].qty=Math.max(0,state.items[i].qty+d);$('q'+i).textContent=state.items[i].qty;renderSummary()}function renderSummary(){const chosen=state.items.filter(x=>x.qty);const total=chosen.reduce((s,x)=>s+x.qty*x.price_pence,0);$('checkout').style.display=chosen.length?'block':'none';$('summary').textContent=chosen.length?chosen.map(x=>x.name+' × '+x.qty).join(' · ')+' — Total '+money(total):''}$('pay').onclick=async()=>{const chosen=state.items.filter(x=>x.qty);if(!$('first').value||!$('last').value||!$('email').value)return $('status').textContent='Please complete your name and email.';const payload={event_id:new URLSearchParams(location.search).get('event')||'',first_name:$('first').value.trim(),last_name:$('last').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),items:chosen.map(x=>({ticket_type_id:x.id,quantity:x.qty}))};$('pay').disabled=true;$('status').textContent='Connecting to PayPal…';try{const r=await fetch('/api/paypal/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not start payment.');if(j.approval_url){sessionStorage.setItem('djgarvin_paypal_order',j.id);location.href=j.approval_url}else throw new Error('PayPal approval link was not returned.')}catch(e){$('status').textContent=e.message||'Payment service is currently unavailable.';$('pay').disabled=false}};load();</script></body></html>
