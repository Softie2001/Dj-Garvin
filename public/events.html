<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events & Tickets — DJ Garvin</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="logo" href="/">DJ GARVIN</a><nav><a href="/">Home</a><a href="/about.html">About</a><a href="/events.html">Events & Tickets</a><a href="/#book">Book DJ</a></nav></header><main><section><p class="eyebrow">UPCOMING EVENTS</p><h1>Events & Tickets</h1><div id="events" class="cards">Loading…</div></section></main><script>
fetch('/api/events').then(r=>r.json()).then(events=>{const el=document.querySelector('#events'); if(!events.length){el.textContent='No events available yet.';return;} el.innerHTML=events.map(e=>`<article class="card"><h2>${e.name}</h2><p>${new Date(e.event_date).toLocaleString()}</p><p>${e.venue||''} ${e.location||''}</p><a class="btn" href="/event.html?slug=${encodeURIComponent(e.slug)}">View event</a></article>`).join('')}).catch(()=>document.querySelector('#events').textContent='Unable to load events.');
</script></body></html>
